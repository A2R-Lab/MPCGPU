# CUDA project; Python is validation/codegen tooling, not a solver binding.
[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["gpu: requires CUDA and sequential native builds", "gpu_proof: included in signed receipt"]

[tool.gpu_proof]
mode = "local"
output = "gpu-proof.json"
github_username = "plancherb1"
fingerprint_paths = ["include", "tools", "examples", "test", "Makefile", "GBD-PCG", "GRiD", "GLASS", "qdldl", "pyproject.toml", "requirements-dev.txt", ".gitmodules", ".github", "website"]
fingerprint_excluded_paths = ["gpu-proof.json"]
max_age_days = 30
require_gpu = true
