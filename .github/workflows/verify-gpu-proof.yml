name: correctness
on:
  push:
    branches: [main, modernizing-tests, modernize-grid-glass]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest test/test_host.py test/test_timing.py -q
  verify-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest-gpu-proof==0.4.0 pyyaml
      - name: Verify complete clean-source receipt
        run: |
          gpu-proof verify --receipt gpu-proof.json --repo . \
            --policy test/gpu-proof-policy.yaml \
            --expected-skips test/expected_skips.txt --require-gpu
